# AI-use disclosure: Codex-authored publication of the actual Godot WebAssembly export.
name: Publish game to GitHub Pages
on:
  push:
    branches: [prototype/first-playable, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Legacy deterministic regression checks
        run: npm run typecheck && npm test
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ninth-life-godot
          key: godot-4.7.2-official-web-linux-v1
      - name: Import and export native Godot game
        env:
          GODOT_TOOL_ROOT: ${{ runner.temp }}/ninth-life-godot
        run: node scripts/build-godot.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Godot game
        id: deployment
        uses: actions/deploy-pages@v4
